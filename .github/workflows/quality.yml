# Детерміновані ворота якості (WS8) — окремий workflow: назви jobs у ci.yml заморожені (на них тримається ruleset).
#   fallow   — fallow audit: мертвий код, складність, дублі, правила Next.js і «послаблені тести» — валить лише НОВІ
#              знахідки відносно бази PR (успадковані показує як контекст);
#   coverage — Vitest із покриттям v8: підлога для доменних файлів (vitest.coverage.config.mts), таблиця — у Summary;
#   deps     — npm audit залежностей продакшену: лише попередження (вивід npm audit недетермінований, job не червоніє).
# Тестові правила лінтера (@vitest/eslint-plugin) — в eslint.config.mjs, тобто вже в обов'язковому job app (ci.yml).
# Порядок впровадження: нові перевірки — дорадчі, доки не буде першого зеленого прогону на main; після нього
# «Ворота: fallow audit» і «Покриття: доменна підлога» додають в обов'язкові перевірки ruleset (deps — ніколи).
name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Новий push у PR скасовує застарілий прогін цього PR; прогони main не скасовуються (як у ci.yml).
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

env:
  FALLOW_TELEMETRY_DISABLED: "1"

jobs:
  fallow:
    name: "Ворота: fallow audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # audit шукає merge-base із базовою гілкою
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # З node_modules fallow правильно класифікує залежності (без них друкує WARN і може помилитися); версія — з lock-файлу.
      - run: npm ci
      - name: fallow audit (лише нове відносно бази)
        # Контекст GitHub — через env, а не підстановкою ${{ }} прямо в run: так звичка не перейде на небезпечніші поля.
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -o pipefail
          if [ "$EVENT" = "pull_request" ]; then BASE="origin/${BASE_REF}"; else BASE="HEAD~1"; fi
          npx fallow audit --base "$BASE" --format github-summary | tee -a "$GITHUB_STEP_SUMMARY"

  coverage:
    name: "Покриття: доменна підлога"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vitest із покриттям (падає, якщо доменний файл нижче своєї підлоги)
        run: npm run test:coverage
      - name: Таблиця покриття → Summary
        if: always()
        run: npm run coverage:summary

  deps:
    name: "Порада: вразливі залежності"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Лише попередження: база advisories змінюється щодня, тож той самий коміт може стати «червоним» без змін у коді.
      - name: npm audit (лише залежності продакшену)
        continue-on-error: true
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo "::warning title=npm audit::Вразливі залежності продакшену — оновіть пакет (див. лог цього кроку)"
            exit 1
          fi

  # Мутанти SQL — обов'язкова перевірка ruleset (рев'ю викладача WS9, п. 1): job є в кожному PR і сам вирішує, чи є що
  # мутувати. Покриття «кожна міграція з правилами має мутанта» перевіряється завжди; самі мутанти (PGlite, ~1–2 хв)
  # проганяються, коли змінено міграції, тести бази, мутанти чи цей workflow.
  mutation-sql:
    name: "Мутанти SQL: правила бази"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # без історії origin/main недоступний, і перевірка змін мовчки пропустила б усе
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Кожна міграція з правилами має мутанта
        run: node scripts/check-mutant-coverage.mjs
      - name: Чи є що мутувати
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # Стан гілки перед усім push (а не лише останній коміт): міграція в передостанньому коміті push теж рахується.
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="origin/${BASE_REF:-main}...HEAD"
          elif [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$' && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            RANGE="$PUSH_BEFORE...HEAD"
          else
            RANGE="HEAD~1...HEAD" # нова гілка чи невідомий before — хоча б останній коміт
          fi
          # package.json / package-lock.json задають команду mutation:sql і версії PGlite та Vitest — теж середовище мутантів.
          if git diff --name-only "$RANGE" | grep -qE '^(supabase/migrations|tests/db)/|^scripts/(mutants|mutation-check|check-mutant-coverage)\.mjs$|^\.github/workflows/quality\.yml$|^package(-lock)?\.json$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=mutation-sql::Міграцій, тестів бази й мутантів не змінено — прогін мутантів пропущено"
          fi
      - if: steps.scope.outputs.run == 'true'
        run: npm ci
      # Код виходу 1 — є SURVIVED чи ERROR (тести правила не доводять), 2 — помилка запуску: job червоний в обох випадках.
      - name: npm run mutation:sql (кожен мутант має бути KILLED)
        if: steps.scope.outputs.run == 'true'
        run: |
          set -o pipefail
          npm run -s mutation:sql -- --json reports/sql-mutation.json --markdown | tee mutation.log
      - name: Вердикти → Summary
        if: always() && steps.scope.outputs.run == 'true'
        run: |
          {
            echo "## Мутанти SQL"
            echo
            grep -E "^Мутаційний бал" mutation.log || echo "Звіту немає — див. лог кроку вище."
            echo
            # Таблиця --markdown разом із розділювачем |---|: усі рядки, що починаються з «|».
            grep -E "^\|" mutation.log || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scope.outputs.run == 'true'
        with:
          name: sql-mutation
          path: reports/sql-mutation.json
          if-no-files-found: ignore
