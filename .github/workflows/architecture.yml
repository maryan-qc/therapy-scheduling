# Архітектурні правила — окремий workflow, щоб не чіпати назви jobs у ci.yml (на них спирається ruleset).
# Кожне правило — швидкий скрипт без залежностей; пояснення — в ADR у docs/decisions/.
name: architecture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  design-tokens:
    name: "Дизайн-система: лише токени"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Скриптам потрібні лише файли репо — токен GitHub у .git/config не зберігаємо.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-design-tokens.mjs

  server-boundary:
    name: "Секретний ключ лише на сервері"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-server-boundary.mjs
      # ADR 0001 відкинув admin-клієнт: секретний ключ обходить RLS, а доступ до карток тримає лише RLS. check:boundary
      # дозволяє admin.ts за умов шаблону, тож заборону з ADR тримає окремий крок. Новий admin-клієнт — спершу новий ADR,
      # що замінює 0001, і зміна цього кроку в тому самому PR.
      - name: "ADR 0001: admin-клієнта немає"
        run: |
          if [ -e src/lib/supabase/admin.ts ]; then
            echo "::error file=src/lib/supabase/admin.ts::ADR 0001 (docs/decisions/0001-client-access-by-rls.md) відкинув admin-клієнт — доступ до даних лише через RLS. Спершу новий ADR, що замінює 0001."
            exit 1
          fi
          echo "OK: src/lib/supabase/admin.ts немає — admin-клієнта в застосунку немає (ADR 0001)."
